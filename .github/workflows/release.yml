name: Release

# knobs is a library: a release is the Go module at the tag. The pushed tag is published to the Go
# checksum database and module proxy after CI passed on its commit and a reviewer approved the
# release environment; the GitHub Release then carries the module zip as the proxy serves it, its
# SBOM, SHA256SUMS and cosign signatures (github-release.yml), and the zip gets SLSA build provenance (attest).
#
# ci-passed → publish-go (environment: release) → github-release → attest

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (vX.Y.Z)"
        required: true

# No cancellation: a release run always completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:

  # ---------------------------------------------------------------------------
  # CI passed — waits for every earlier workflow run on this commit to finish, and fails if any is
  # red, so a red commit is never published.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed on this commit
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - run: make wait-for-ci
        env:
          GH_TOKEN: ${{ github.token }}

  # ---------------------------------------------------------------------------
  # Publish — after approval in the release environment, the module at the tag is recorded in the Go
  # checksum database and proxy; the job ends when the proxy serves it.
  # ---------------------------------------------------------------------------
  publish-go:
    name: Publish Go module
    needs: ci-passed
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - run: make publish-go-module
        env:
          # A manual run names its tag here; a tag push needs none (release_tag, scripts/lib/release-tag.sh).
          INPUT_TAG: ${{ inputs.tag }}

      - run: make wait-for-publish ARGS="go"
        env:
          # A manual run names its tag here; a tag push needs none (release_tag, scripts/lib/release-tag.sh).
          INPUT_TAG: ${{ inputs.tag }}

  # ---------------------------------------------------------------------------
  # GitHub Release — the published module's assets, signed, and the release notes; rerunnable for
  # any tag by dispatching github-release.yml.
  # ---------------------------------------------------------------------------
  github-release:
    name: release / github
    needs: publish-go
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/github-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  # ---------------------------------------------------------------------------
  # Provenance — SLSA build provenance for the module zip the GitHub Release carries, checked against
  # its SHA256SUMS first; verify with `gh attestation verify knobs-vX.Y.Z.zip -R keelcore/knobs`.
  # ---------------------------------------------------------------------------
  attest:
    name: Attest module provenance
    needs: github-release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - run: make pull-release-module
        env:
          # GitHub can refuse anonymous release downloads; the job's read-only token authenticates them.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A manual run names its tag here; a tag push needs none (release_tag, scripts/lib/release-tag.sh).
          INPUT_TAG: ${{ inputs.tag }}

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/*.zip'
