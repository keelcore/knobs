name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR.
# Keep main-branch runs to completion so history is complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Default: least privilege. Jobs that need more declare it explicitly.
permissions:
  contents: read

# Every make target runs its tools in the dev image (containers/dev/Containerfile, via
# scripts/dev/run.sh and docker): no tool is installed on the runner.
# Repositories are UTC internally (governance/devsecops.md): every step runs in UTC.
env:
  TZ: UTC

jobs:

  # ---------------------------------------------------------------------------
  # The tool image for this tree's build context, published once (skipped when it is
  # already in GHCR); every tool job below pulls it instead of building it. Pull requests
  # do not publish: their tool jobs pull a published context or build it in the runner.
  # ---------------------------------------------------------------------------
  dev-image:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/dev-image.yml
    permissions:
      contents: read
      packages: write
      id-token: write

  # ---------------------------------------------------------------------------
  # PR Policy — required gate; runs before build and test jobs.
  # All policy logic lives in scripts/ci/check-pr-policy.sh.
  # ---------------------------------------------------------------------------
  pr-policy:
    name: PR Policy
    needs: dev-image
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Check PR policy
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: make check-pr-policy
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # CI Audit — required gate; verifies all run: steps are make <target>, all
  # scripts have targets, canonical scripts match .standards, and the live
  # rulesets match .github/rulesets.
  # ---------------------------------------------------------------------------
  ci-audit:
    name: CI Audit
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run CI/Makefile audit
        run: make audit
      - name: Verify canonical scripts are byte-identical to .standards
        run: make verify-canonical
      - name: Check rulesets against .github/rulesets
        env:
          GH_TOKEN: ${{ github.token }}
        run: make check-rulesets
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Secret Scan — required gate; runs on every push and PR.
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret Scan
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Scan for secrets
        run: make check-secrets
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Lint — aggregates every language's formatter check and linter, markdownlint,
  # shellcheck, trailing newlines and the suppression scan.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Lint
        run: make lint
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Workflow Lint — actionlint and zizmor over .github/workflows.
  # ---------------------------------------------------------------------------
  workflow-lint:
    name: Workflow Lint
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: actionlint + zizmor
        env:
          # zizmor online audits (impostor commits, pin/version drift, known-vulnerable actions).
          GH_TOKEN: ${{ github.token }}
        run: make lint-workflows
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Security gates — dependency vulnerabilities (govulncheck), Go SAST (gosec, with the
  # reviewed sites in config/gosec-sites.local.txt), a short fuzz pass over every native fuzz
  # target, and the dependency license allowlist.
  # ---------------------------------------------------------------------------
  vuln:
    name: Vulnerability Scan
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: govulncheck
        run: make lint-vuln
      - run: make check-clean-tree

  gosec:
    name: SAST (gosec)
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: gosec
        run: make lint-gosec
      - run: make check-clean-tree

  fuzz:
    name: Fuzz
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Fuzz (10s per target)
        run: make test-fuzz
      - run: make check-clean-tree

  licenses:
    name: Licenses
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: License allowlist
        run: make lint-licenses
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Unit Tests — every implementation's unit tests; JUnit XML and coverage.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit (linux)
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Unit tests
        run: make test-unit
      # The tool targets leave the tree as checked out; checked before the Codecov uploader downloads itself into it.
      - run: make check-clean-tree
      - name: Upload coverage to Codecov
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: target/coverage.txt
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Native platforms — the dev image cross-builds everything a macOS or Windows
  # host runs (the Go test binaries, bats, the conformance harness); the native
  # jobs only execute it. No toolchain is installed on the native runners.
  # ---------------------------------------------------------------------------
  native-build:
    name: Native build (${{ matrix.platform }})
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: darwin
            arch: arm64
          - platform: windows
            os: windows
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Cross-build native test binaries and the conformance harness
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: make build-native
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: native-${{ matrix.platform }}
          path: target/native/
          retention-days: 1
      - run: make check-clean-tree

  unit-native:
    name: Unit (${{ matrix.platform }})
    needs: native-build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-26
            dir: target/native/darwin-arm64
          - platform: windows
            runner: windows-2025-vs2026
            dir: target/native/windows-amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-${{ matrix.platform }}
          path: target/native/
      - name: Run native unit tests
        shell: bash
        env:
          DIR: ${{ matrix.dir }}
        run: make test-native

  # ---------------------------------------------------------------------------
  # Integrity (macOS) — the conformance suite and the harness integrity checks
  # against the darwin/arm64 harness the dev image cross-built.
  # ---------------------------------------------------------------------------
  integrity-macos:
    name: Integrity (BATS, macOS)
    needs: native-build
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-macos
          path: target/native/
      - name: Run the conformance and integrity suites (darwin harness from the dev image)
        env:
          DIR: target/native/darwin-arm64
        run: make test-native-integrity

  # ---------------------------------------------------------------------------
  # Windows Smoke — the harness integrity checks against the windows/amd64
  # harness: it starts, and rejects bad invocations cleanly.
  # ---------------------------------------------------------------------------
  build-windows-smoke:
    name: Windows Smoke
    needs: native-build
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: native-windows
          path: target/native/
      - name: Smoke test (windows harness from the dev image)
        shell: bash
        env:
          DIR: target/native/windows-amd64
        run: make test-native-integrity

  # ---------------------------------------------------------------------------
  # Integration — the BATS suites, including the conformance suite run against
  # every implementation's harness.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration (BATS)
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: BATS suites
        run: make test-integration
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Manual release tag — a dispatch from main runs in a manual release's context: GitHub sets
  # GITHUB_REF_NAME to the branch and GITHUB_REF_TYPE to branch, and only INPUT_TAG names the tag.
  # The release's read-only steps run against the published v0.8.2, so a manual release never
  # takes the branch for its tag.
  # ---------------------------------------------------------------------------
  manual-release-tag:
    name: Manual release tag
    needs: dev-image
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: make wait-for-publish ARGS="go"
        env:
          INPUT_TAG: v0.8.2
          WAIT_TIMEOUT: '120'
      - run: make pull-release-module
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: v0.8.2
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Coverage Delta — PR-only gate. Measures coverage at the merge-target commit
  # (base), then at the PR head, and fails if the drop exceeds 1 percentage point.
  # ---------------------------------------------------------------------------
  coverage-delta:
    name: Coverage Delta
    needs: dev-image
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Check coverage delta
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COVERAGE_THRESHOLD: '1.0'
        run: make check-coverage-delta
      - run: make check-clean-tree

  # ---------------------------------------------------------------------------
  # Coverage No-Regression — per-file gate against the committed baseline at
  # tests/coverage-baseline.lcov, over every language's LCOV. Runs on push AND
  # pull_request so direct pushes to main are gated too.
  # ---------------------------------------------------------------------------
  coverage-no-regression:
    name: Coverage No-Regression
    needs: dev-image
    if: ${{ !cancelled() && needs.dev-image.result != 'failure' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Generate coverage LCOV
        run: make test-coverage
      - name: Per-file no-regression gate
        run: make check-coverage-regression
      - run: make check-clean-tree
