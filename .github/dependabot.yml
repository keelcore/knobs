version: 2

updates:
  # Keep GitHub Actions SHA pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"

  # Keep the digest-pinned dev image base current.
  - package-ecosystem: docker
    directories:
      - /containers/dev
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(deps)"

  # Keep the .standards submodule pointer current.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - standards
    commit-message:
      prefix: "chore(deps)"
